name: nox-backend

services:
  auth-setup:
    image: ghcr.io/mapherez/nox-backend:${NOX_BACKEND_IMAGE_TAG:-latest}
    command: ["auth-setup"]
    restart: "no"
    environment:
      NOX_BACKEND_DATA_DIR: "${NOX_BACKEND_DATA_DIR:-${NOX_SYNC_DATA_DIR:-/data}}"
      NOX_BACKEND_PUBLIC_URL: "${NOX_BACKEND_PUBLIC_URL:?Set the browser-facing Backend origin}"
      NOX_AUTH_PUBLIC_URL: "${NOX_AUTH_PUBLIC_URL:?Set the NoX Auth HTTPS origin}"
      NOX_BACKEND_SUITE_SOCKET_DIR: /run/nox-suite
    volumes:
      - nox-backend-data:/data
      - nox-suite-local:/run/nox-suite
      - nox-auth-admin:/run/nox-auth-admin
    healthcheck:
      disable: true

  backend:
    image: ghcr.io/mapherez/nox-backend:${NOX_BACKEND_IMAGE_TAG:-latest}
    depends_on:
      auth-setup:
        condition: service_completed_successfully
    container_name: nox-backend
    restart: unless-stopped
    environment:
      NOX_BACKEND_DIRECT_MCP_ENABLED: "${NOX_BACKEND_DIRECT_MCP_ENABLED:-${NOX_SYNC_DIRECT_MCP_ENABLED:-true}}"
      NOX_BACKEND_SUITE_MCP_ENABLED: "${NOX_BACKEND_SUITE_MCP_ENABLED:-${NOX_SYNC_SUITE_MCP_ENABLED:-false}}"
      NOX_BACKEND_VERSION: "${NOX_BACKEND_VERSION:-${NOX_SYNC_VERSION:-}}"
      NOX_BACKEND_ADDR: "${NOX_BACKEND_ADDR:-${NOX_SYNC_ADDR:-:8080}}"
      NOX_BACKEND_DATA_DIR: "${NOX_BACKEND_DATA_DIR:-${NOX_SYNC_DATA_DIR:-/data}}"
      NOX_BACKEND_PUBLIC_URL: "${NOX_BACKEND_PUBLIC_URL:?Set the browser-facing Backend origin}"
      NOX_AUTH_PUBLIC_URL: "${NOX_AUTH_PUBLIC_URL:?Set the NoX Auth HTTPS origin}"
      NOX_BACKEND_TLS_CERT_FILE: "${NOX_BACKEND_TLS_CERT_FILE:-${NOX_SYNC_TLS_CERT_FILE:-}}"
      NOX_BACKEND_TLS_KEY_FILE: "${NOX_BACKEND_TLS_KEY_FILE:-${NOX_SYNC_TLS_KEY_FILE:-}}"
      NOX_BACKEND_TLS_CA_FILE: "${NOX_BACKEND_TLS_CA_FILE:-${NOX_SYNC_TLS_CA_FILE:-}}"
      NOX_BACKEND_SUITE_REPORT_INTERVAL_MS: "${NOX_BACKEND_SUITE_REPORT_INTERVAL_MS:-${NOX_SYNC_SUITE_REPORT_INTERVAL_MS:-15000}}"
      NOX_BACKEND_SUITE_OBSERVATION_FRESHNESS_MS: "${NOX_BACKEND_SUITE_OBSERVATION_FRESHNESS_MS:-${NOX_SYNC_SUITE_OBSERVATION_FRESHNESS_MS:-45000}}"
      NOX_BACKEND_SUITE_SOCKET_DIR: /run/nox-suite
    volumes:
      - nox-backend-data:/data
      - nox-suite-local:/run/nox-suite

  frontend:
    image: ghcr.io/mapherez/nox-backend-frontend:${NOX_FRONTEND_IMAGE_TAG:-${NOX_BACKEND_IMAGE_TAG:-latest}}
    restart: unless-stopped
    ports:
      - "${NOX_FRONTEND_PORT:-5710}:8080"
    environment:
      NOX_FRONTEND_BACKEND_URL: "${NOX_FRONTEND_BACKEND_URL:-http://backend:8080}"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nox-backend-data:
    name: "${NOX_BACKEND_DATA_VOLUME_NAME:-${NOX_SYNC_DATA_VOLUME_NAME:-nox-backend-data}}"

  nox-suite-local:
    name: "${NOX_SUITE_LOCAL_VOLUME_NAME:-nox-suite-local}"
    external: true

  nox-auth-admin:
    name: "${NOX_AUTH_ADMIN_VOLUME_NAME:-nox-auth-admin}"
    external: true
