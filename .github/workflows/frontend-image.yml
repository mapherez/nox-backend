name: Publish frontend image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-image-${{ github.sha }}
  cancel-in-progress: false
jobs:
  approval:
    name: Reuse approved source CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.ci.outputs.source_sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Require successful CI for the exact source
        id: ci
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireApprovedCI } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-policy.mjs`).href);
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.slice('refs/tags/'.length) : '';

            const approval = await requireApprovedCI({ github, ...context.repo, revision: context.sha, tag });
            core.setOutput('source_sha', approval.sourceSha);
            core.setOutput('ci_run_id', String(approval.runId));
            core.notice(`Reusing source CI ${approval.runId} (${approval.sourceSha}); no source checks are repeated.`);

  frontend:
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse replacing an existing frontend tag
        env:
          IMAGE: ghcr.io/mapherez/nox-backend-frontend:sha-${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2> image-error.txt; then
            echo 'This immutable frontend tag already exists.' >&2
            exit 1
          fi
          if ! grep -qiE 'manifest unknown|not found|no such manifest' image-error.txt; then
            cat image-error.txt >&2
            exit 1
          fi
      - name: Publish only the frontend for this source commit
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mapherez/nox-backend-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/mapherez/nox-backend
