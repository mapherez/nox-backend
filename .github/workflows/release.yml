name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Prevent concurrent reruns for one tag without cancelling other releases.
concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release tag and VERSION
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Refuse an existing GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            for await (const { data } of github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            })) {
              if (data.some(release => release.tag_name === process.env.RELEASE_TAG)) {
                throw new Error(`Release ${process.env.RELEASE_TAG} already exists; refusing to replace it.`);
              }
            }

      - name: Test release tooling
        run: node --test scripts/release.test.mjs

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/mapherez/nox-backend:${{ github.ref_name }}
            ghcr.io/mapherez/nox-backend:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/mapherez/nox-backend

      - name: Create GitHub Release with generated notes
        uses: actions/github-script@v8
        with:
          script: |
            // Create only: the API fails if this tag already has a release, including a race.
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              name: process.env.RELEASE_TAG,
              generate_release_notes: true,
              prerelease: process.env.RELEASE_TAG.includes('-'),
            });
