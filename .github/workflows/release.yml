name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Prevent concurrent reruns for one tag without cancelling other releases.
concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release tag against package.json
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Refuse an existing GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            for await (const { data } of github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            })) {
              if (data.some(release => release.tag_name === process.env.RELEASE_TAG)) {
                throw new Error(`Release ${process.env.RELEASE_TAG} already exists; refusing to replace it.`);
              }
            }

      - name: Test release tooling
        run: |
          node --test scripts/release.test.mjs
          python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test -race ./...

      - name: Install and validate frontend
        run: |
          npm ci --prefix frontend
          npm run check --prefix frontend
          npm test --prefix frontend

      - name: Validate native split images and browser workflows before publication
        run: |
          docker build --build-arg VERSION="$RELEASE_TAG" -t nox-backend:release-check ./backend
          docker build -t nox-backend-frontend:release-check ./frontend
          python3 scripts/check-image-contracts.py --versioned-image nox-backend:release-check --build-version "$RELEASE_TAG"
          cd frontend
          npx playwright install --with-deps chromium
          cd ..
          python3 scripts/check-split-deployment.py --backend-image nox-backend:release-check --frontend-image nox-backend-frontend:release-check --browser

      - name: Verify local Suite channel and browser setup
        run: python3 scripts/check-suite-proxy.py --browser --backend-image nox-backend:release-check --frontend-image nox-backend-frontend:release-check

      - name: Verify shipped Compose and real Auth enrollment before publication
        run: python3 scripts/check-auth-compose.py --backend-image nox-backend:release-check --frontend-image nox-backend-frontend:release-check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata from validated release version
        id: metadata
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"

      - name: Generate independent frontend image metadata
        id: frontend_metadata
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG" frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.frontend_metadata.outputs.tags }}
          labels: ${{ steps.frontend_metadata.outputs.labels }}

      - name: Create GitHub Release with generated notes
        uses: actions/github-script@v8
        env:
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        with:
          script: |
            // Create only: the API fails if this tag already has a release, including a race.
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              name: process.env.RELEASE_TAG,
              generate_release_notes: true,
              prerelease: process.env.RELEASE_PRERELEASE === 'true',
            });
