name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-backend-ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'nox-backend-Release:') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Recognize a version-only release request
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=$(node scripts/ci-policy.mjs classify "$GITHUB_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy:
    name: CI reuse policy tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: node --test scripts/ci-policy.test.mjs

  release-tooling:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Test
        run: |
          node --test scripts/release.test.mjs
          python3 -m unittest discover -s scripts -p "test_*.py"

  backend:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  frontend:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Frontend (React + TypeScript + Vite+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build backend image
        run: docker build -t nox-backend:test ./backend

      - name: Build versioned backend image
        run: docker build --build-arg VERSION=contract-test -t nox-backend:contract-test ./backend

      - name: Check image version contracts
        run: python3 scripts/check-image-contracts.py --default-image nox-backend:test --versioned-image nox-backend:contract-test --build-version contract-test

      - name: Build independent frontend image
        run: docker build -t nox-backend-frontend:test ./frontend

      - name: Verify split deployment and preserve existing browser/API/MCP flows
        run: python3 scripts/check-split-deployment.py --backend-image nox-backend:contract-test --frontend-image nox-backend-frontend:test

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify React in a real browser through the split deployment
        run: python3 scripts/check-split-deployment.py --backend-image nox-backend:contract-test --frontend-image nox-backend-frontend:test --browser

      - name: Verify local Suite channel and browser setup
        run: python3 scripts/check-suite-proxy.py --browser --backend-image nox-backend:contract-test --frontend-image nox-backend-frontend:test

      - name: Verify shipped Compose and real Auth enrollment
        run: python3 scripts/check-auth-compose.py --backend-image nox-backend:contract-test --frontend-image nox-backend-frontend:test

  formatting:
    name: Formatting
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run test:format

  approved:
    name: CI approved
    needs: [plan, policy, release-tooling, backend, frontend, docker, formatting]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
