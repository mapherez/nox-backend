name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "scripts/**"
      - "package.json"
      - "VERSION"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test
        run: node --test scripts/release.test.mjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build backend image
        run: docker build -t nox-backend:test ./backend

      - name: Build versioned backend image
        run: docker build --build-arg VERSION=contract-test -t nox-backend:contract-test ./backend

      - name: Check image version contracts
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          def docker(*args):
              return subprocess.check_output(["docker", *args], text=True).strip()

          for image, canonical, legacy, expected in [
              ("nox-backend:test", None, None, "dev"),
              ("nox-backend:contract-test", None, None, "contract-test"),
              ("nox-backend:contract-test", "", "", "contract-test"),
              ("nox-backend:contract-test", None, "runtime-test", "runtime-test"),
              ("nox-backend:contract-test", "canonical", None, "canonical"),
              ("nox-backend:contract-test", "canonical", "legacy", "canonical"),
              ("nox-backend:contract-test", "", "legacy", "legacy"),
          ]:
              args = ["run", "--detach", "--rm", "--publish", "127.0.0.1::8080",
                      "--tmpfs", "/data:uid=10001,gid=10001,mode=0700"]
              for name, value in [("NOX_BACKEND_VERSION", canonical), ("NOX_SYNC_VERSION", legacy)]:
                  if value is not None:
                      args += ["--env", name + "=" + value]
              container = docker(*args, image)
              try:
                  base = "http://" + docker("port", container, "8080/tcp")
                  for attempt in range(60):
                      try:
                          with urllib.request.urlopen(base + "/v1/health", timeout=2) as response:
                              assert response.status == 200
                              health = json.load(response)
                          break
                      except (urllib.error.URLError, TimeoutError):
                          time.sleep(0.5)
                  else:
                      raise AssertionError("Backend did not become ready")
                  with urllib.request.urlopen(base + "/v1/info", timeout=2) as response:
                      assert response.status == 200
                      assert response.headers["Content-Type"] == "application/json"
                      info = json.load(response)
                  assert health == {"status": "ready", "version": expected,
                                    "dataDirInitialized": True, "databasePath": "/data/nox-backend.db"}, health
                  required_info = {"service": "nox-backend", "version": expected, "apiVersion": "v1",
                                   "capabilities": ["auth", "vaults", "files", "vault-status"]}
                  for field, value in required_info.items():
                      assert field in info and type(info[field]) is type(value) and info[field] == value, (field, info)
                  print(f"{image}: canonical={canonical!r}, legacy={legacy!r}, health/info version={expected}")
              except Exception:
                  subprocess.run(["docker", "logs", container], check=False)
                  raise
              finally:
                  subprocess.run(["docker", "rm", "--force", container], check=False)
          PY
