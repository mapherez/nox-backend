name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".env.example"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test
        run: |
          node --test scripts/release.test.mjs
          python3 -m unittest discover -s scripts -p "test_*.py"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  frontend:
    name: Frontend (React + TypeScript + Vite+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build backend image
        run: docker build -t nox-backend:test ./backend

      - name: Build versioned backend image
        run: docker build --build-arg VERSION=contract-test -t nox-backend:contract-test ./backend

      - name: Check image version contracts
        run: python3 scripts/check-image-contracts.py --default-image nox-backend:test --versioned-image nox-backend:contract-test --build-version contract-test

      - name: Build independent frontend image
        run: docker build -t nox-backend-frontend:test ./frontend

      - name: Verify split deployment and preserve existing browser/API/MCP flows
        run: python3 scripts/check-split-deployment.py --backend-image nox-backend:contract-test --frontend-image nox-backend-frontend:test


      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify React in a real browser through the split deployment
        run: python3 scripts/check-split-deployment.py --backend-image nox-backend:contract-test --frontend-image nox-backend-frontend:test --browser

      - name: Verify local Suite channel and browser setup
        run: python3 scripts/check-suite-proxy.py --browser --backend-image nox-backend:contract-test --frontend-image nox-backend-frontend:test

      - name: Verify shipped Compose and real Auth enrollment
        run: python3 scripts/check-auth-compose.py --backend-image nox-backend:contract-test --frontend-image nox-backend-frontend:test
